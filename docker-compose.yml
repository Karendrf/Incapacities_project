version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: incapacities-nginx
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - incapacities-network
    restart: unless-stopped
    
  postgres_payroll:
    image: postgres:15-alpine
    container_name: postgres_payroll
    environment:
      POSTGRES_DB: payroll_db
      POSTGRES_USER: payroll_user
      POSTGRES_PASSWORD: payroll_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_payroll_data:/var/lib/postgresql/data
    networks:
      - payroll_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d payroll_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payroll_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll_service
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres_payroll
      DB_PORT: 5432
      DB_NAME: payroll_db
      DB_USER: payroll_user
      DB_PASSWORD: payroll_password
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
    ports:
      - "3002:3002"
    depends_on:
      postgres_payroll:
        condition: service_healthy
    networks:
      - payroll_network
    restart: unless-stopped

volumes:
  postgres_payroll_data:

networks:
  payroll_network:
    driver: bridge